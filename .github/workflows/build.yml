name: Build 6p_priv.exe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install psutil winshell pyinstaller
      - run: pyinstaller --onefile --windowed --name=6p_priv --noconfirm main.py
      - uses: actions/upload-artifact@v4
        with:
          name: 6p_priv.exe
          path: dist/6p_priv.exe
