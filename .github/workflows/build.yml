name: Build 6p_priv.exe

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    name: Compilar no Windows
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compilar com PyInstaller
        run: |
          pyinstaller --onefile --windowed --name=6p_priv --clean --noconfirm main.py

      - name: Verificar executável
        run: |
          ls -la dist/6p_priv.exe
          ./dist/6p_priv.exe --help 2>&1 | head -5 || true

      - name: Upload do artefato (download direto)
        uses: actions/upload-artifact@v4
        with:
          name: 6p_priv.exe
          path: dist/6p_priv.exe
          retention-days: 30
