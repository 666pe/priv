name: Build Debug (com console)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install psutil winshell pyinstaller
      - run: |
          pyinstaller --onefile --console --name=6p_priv_debug --noconfirm ^
            --hidden-import=psutil ^
            --hidden-import=winshell ^
            --hidden-import=tkinter ^
            --hidden-import=tkinter.ttk ^
            --hidden-import=tkinter.scrolledtext ^
            --collect-all=tkinter ^
            main.py
      - uses: actions/upload-artifact@v4
        with:
          name: 6p_priv_debug.exe
          path: dist/6p_priv_debug.exe
